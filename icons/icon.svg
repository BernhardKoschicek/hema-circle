<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a0812"/>
      <stop offset="100%" stop-color="#0e1014"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield Shape -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8"/>

  <!-- Subtle Shield Outline -->
  <path d="M256 60 C370 60 410 90 410 200 C410 330 330 420 256 450 C182 420 102 330 102 200 C102 90 142 60 256 60 Z" fill="none" stroke="#e11d48" stroke-width="4" opacity="0.5"/>

  <!-- Sword 1 (Top-Left to Bottom-Right) -->
  <g transform="translate(256,256) rotate(45) translate(-256,-256)">
    <!-- Blade -->
    <path d="M253 90 L256 70 L259 90 L259 340 L253 340 Z" fill="url(#bladeGrad)" filter="url(#glow)"/>
    <!-- Fuller Line -->
    <line x1="256" y1="95" x2="256" y2="330" stroke="#475569" stroke-width="1.5"/>
    <!-- Crossguard -->
    <rect x="200" y="340" width="112" height="12" rx="4" fill="url(#goldGrad)"/>
    <circle cx="202" cy="346" r="6" fill="url(#goldGrad)"/>
    <circle cx="310" cy="346" r="6" fill="url(#goldGrad)"/>
    <!-- Grip -->
    <rect x="251" y="352" width="10" height="55" rx="3" fill="#3b111f"/>
    <!-- Pommel -->
    <circle cx="256" cy="418" r="14" fill="url(#goldGrad)"/>
  </g>

  <!-- Sword 2 (Top-Right to Bottom-Left) -->
  <g transform="translate(256,256) rotate(-45) translate(-256,-256)">
    <!-- Blade -->
    <path d="M253 90 L256 70 L259 90 L259 340 L253 340 Z" fill="url(#bladeGrad)" filter="url(#glow)"/>
    <!-- Fuller Line -->
    <line x1="256" y1="95" x2="256" y2="330" stroke="#475569" stroke-width="1.5"/>
    <!-- Crossguard -->
    <rect x="200" y="340" width="112" height="12" rx="4" fill="url(#goldGrad)"/>
    <circle cx="202" cy="346" r="6" fill="url(#goldGrad)"/>
    <circle cx="310" cy="346" r="6" fill="url(#goldGrad)"/>
    <!-- Grip -->
    <rect x="251" y="352" width="10" height="55" rx="3" fill="#3b111f"/>
    <!-- Pommel -->
    <circle cx="256" cy="418" r="14" fill="url(#goldGrad)"/>
  </g>
</svg>
